name: Pages

# 3Dschool, the school edition of Sawhorse, published with GitHub Pages ("workflow" build type).
# The kernel (Rust, compiled to WebAssembly) and the app (Vite) are built here; the base path
# is "/<repository>/" on the github.io project address.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SAWHORSE_NO_WSL: "1"

jobs:
  build:
    name: Build the app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates
      - name: install wasm-pack
        run: npm install -g wasm-pack@0.15.0
      - run: npm ci
      - name: wasm-pack build (the kernel)
        run: npm run wasm
      - name: build the app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
