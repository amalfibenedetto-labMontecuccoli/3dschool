name: Pages

# 3Dschool, the school edition of Sawhorse, published with GitHub Pages ("workflow" build type).
# The kernel (Rust, compiled to WebAssembly) and the app (Vite) are built here; the base path
# is "/<repository>/" on the github.io project address.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SAWHORSE_NO_WSL: "1"

jobs:
  build:
    name: Build the app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: install wasm-pack
        run: npm install -g wasm-pack@0.15.0
      - run: npm ci
      - name: wasm-pack build (the kernel)
        run: npm run wasm
      - name: build the app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
